server:
  port: 8084

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
  application:
    name: scheduling-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/scheduling_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME:scheduling_user}
    password: ${DB_PASSWORD:scheduling_user_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Tin nhắn xử lý lỗi không bị đẩy lại vô hạn mà chuyển sang hàng đợi lỗi (DLQ)
        default-requeue-rejected: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # Mặc định 40 giây mới đăng ký và 30 giây mới cập nhật danh bạ; rút ngắn để vừa bật xong là gọi được nhau
    initial-instance-info-replication-interval-seconds: 5
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

scheduling:
  hold-minutes: 5
  cancel-before-hours: 2
