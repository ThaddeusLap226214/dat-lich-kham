server:
  port: 8080

spring:
  application:
    name: api-gateway
  web:
    error:
      include-message: always
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      server:
        webflux:
          default-filters:
            - name: CircuitBreaker
              args:
                name: defaultCircuitBreaker
                fallbackUri: forward:/fallback
          # Đường dẫn /internal/** không có route nào → client bên ngoài không gọi được API nội bộ
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/accounts/**
            - id: provider-service
              uri: lb://provider-service
              predicates:
                - Path=/api/v1/specialties/**,/api/v1/doctors/**,/api/v1/rooms/**,/api/v1/work-schedules/**
            - id: patient-service
              uri: lb://patient-service
              predicates:
                - Path=/api/v1/patients/**,/api/v1/duplicate-candidates/**
            - id: scheduling-service
              uri: lb://scheduling-service
              predicates:
                - Path=/api/v1/slots/**,/api/v1/appointments/**
            - id: reminder-service
              uri: lb://reminder-service
              predicates:
                - Path=/api/v1/reminders/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # Mặc định 40 giây mới đăng ký và 30 giây mới cập nhật danh bạ; rút ngắn để vừa bật xong là gọi được nhau
    initial-instance-info-replication-interval-seconds: 5
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

frontend:
  origin: ${FRONTEND_ORIGIN:http://localhost:4200}

# Thời gian chờ tối đa khi Gateway tự gọi service (API ghép); C-3, cùng giá trị với Scheduling, Reminder
clinic:
  client-timeout: 3s

jwt:
  secret: ${JWT_SECRET:doi-chuoi-nay-trong-file-env-it-nhat-32-ky-tu!!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
