server:
  port: 8081

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/auth_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD:auth_user_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # Mặc định 40 giây mới đăng ký và 30 giây mới cập nhật danh bạ; rút ngắn để vừa bật xong là gọi được nhau
    initial-instance-info-replication-interval-seconds: 5
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Auth Service là bên duy nhất gọi Keycloak Admin API (R23); client và mật khẩu khai trong realm, mật khẩu lấy từ .env
keycloak:
  base-url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:dat-lich-kham}
  client-id: ${KEYCLOAK_CLIENT_ID:auth-service}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:doi-chuoi-nay-trong-file-env}
  timeout: 3s
