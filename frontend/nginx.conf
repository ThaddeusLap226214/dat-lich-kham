server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Ứng dụng một trang (SPA): mọi đường dẫn không phải file đều trả index.html để Angular tự điều hướng
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html phải luôn hỏi lại máy chủ, nếu không trình duyệt giữ bản cũ sau mỗi lần build
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
