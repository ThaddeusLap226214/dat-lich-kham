<header class="header">
  <div class="search-wrapper">
    @if (showSearch()) {
      <span class="material-symbols-outlined search-icon">search</span>
      <input type="text" class="search-input" placeholder="Tìm kiếm bệnh nhân..." [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch()">
    }
  </div>

  <div class="header-actions">
    @if (identity.role() === 'GUEST') {
      <button class="auth-btn" (click)="login()">
        <span class="material-symbols-outlined">login</span> Đăng nhập
      </button>
    } @else {
      <div class="user-box">
        <div class="user-text">
          <span class="user-label">{{ identity.identity().label }}</span>
          <span class="user-role-label">{{ roleLabels[identity.role()] }}</span>
        </div>
        <button class="auth-btn" (click)="logout()">
          <span class="material-symbols-outlined">logout</span> Đăng xuất
        </button>
      </div>
    }
  </div>
</header>
