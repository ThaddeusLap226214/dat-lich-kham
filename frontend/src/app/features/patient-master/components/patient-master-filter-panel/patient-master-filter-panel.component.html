<div class="filter-panel">
  <div class="filter-section">
    <p class="filter-label">Giới tính</p>
    <div class="filter-options">
      @for (gender of genderOptions; track gender.value) {
        <label class="filter-checkbox">
          <input
            type="checkbox"
            [checked]="selectedGenders.has(gender.value)"
            (change)="toggleGender(gender.value)">
          <span>{{ gender.label }}</span>
        </label>
      }
    </div>
  </div>

  <div class="filter-section">
    <p class="filter-label">Trạng thái hồ sơ</p>
    <div class="filter-options">
      @for (status of statusOptions; track status.value) {
        <label class="filter-checkbox">
          <input
            type="checkbox"
            [checked]="selectedStatuses.has(status.value)"
            (change)="toggleStatus(status.value)">
          <span>{{ status.label }}</span>
        </label>
      }
    </div>
  </div>

  <div class="filter-section">
    <p class="filter-label">Hệ thống nguồn</p>
    <div class="filter-options">
      @for (system of sourceSystems; track system.id) {
        <label class="filter-checkbox">
          <input
            type="checkbox"
            [checked]="selectedSourceSystems.has(system.id)"
            (change)="toggleSourceSystem(system.id)">
          <span>{{ system.name }}</span>
        </label>
      }
    </div>
  </div>

  <div class="filter-actions">
    <button class="btn-reset" (click)="reset()">Đặt lại</button>
    <button class="btn-apply" (click)="apply()">Áp dụng</button>
  </div>
</div>
